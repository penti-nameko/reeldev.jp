name: CI / Build & Push

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}

jobs:
  # ─────────────── Frontend ───────────────
  build-frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install & type-check
        working-directory: frontend
        run: |
          npm ci
#          npm run lint
#        env:
#          ESLINT_USE_FLAT_CONFIG: false  

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push Docker image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v5
        with:
          context: frontend
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/reeldevjp-frontend:latest
            ${{ env.IMAGE_PREFIX }}/reeldevjp-frontend:${{ github.sha }}

  # ─────────────── BFF ───────────────
  build-bff:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: bff/package-lock.json

      - name: Install & type-check
        working-directory: bff
        run: |
          npm ci
          npm run build

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push Docker image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v5
        with:
          context: bff
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/reeldevjp-bff:latest
            ${{ env.IMAGE_PREFIX }}/reeldevjp-bff:${{ github.sha }}

  # ─────────────── Update k8s image tag ───────────────
  update-image-tag:
    needs: [build-frontend, build-bff]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.TOKEN }}

      - name: Update image tags in kustomization
        run: |
          cd k8s/overlays/production
          sed -i "s|newTag: .*|newTag: \"${{ github.sha }}\"|g" kustomization.yaml

      - name: Commit updated tags
        run: |
          git config user.email "ci@github.com"
          git config user.name "GitHub Actions"
          git add k8s/overlays/production/kustomization.yaml
          git commit -m "ci: update image tags to ${{ github.sha }}" || echo "No changes"
          git push
