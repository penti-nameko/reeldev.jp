apiVersion: apps/v1
kind: Deployment
metadata:
  name: portfolio-bff
  labels:
    app: portfolio-bff
spec:
  replicas: 2
  selector:
    matchLabels:
      app: portfolio-bff
  template:
    metadata:
      labels:
        app: portfolio-bff
    spec:
      containers:
        - name: bff
          image: ghcr.io/penti-nameko/portfolio-bff:latest
          ports:
            - containerPort: 3001
          env:
            - name: PORT
              value: "3001"
            - name: NODE_ENV
              value: "production"
            - name: QIITA_USER
              valueFrom:
                configMapKeyRef:
                  name: portfolio-config
                  key: QIITA_USER
            - name: QIITA_TOKEN
              valueFrom:
                secretKeyRef:
                  name: portfolio-secrets
                  key: QIITA_TOKEN
            - name: CORS_ORIGIN
              valueFrom:
                configMapKeyRef:
                  name: portfolio-config
                  key: CORS_ORIGIN
          readinessProbe:
            httpGet:
              path: /healthz
              port: 3001
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 3001
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
