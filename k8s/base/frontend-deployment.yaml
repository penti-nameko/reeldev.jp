apiVersion: apps/v1
kind: Deployment
metadata:
  name: reeldevjp-frontend
  labels:
    app: reeldevjp-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: reeldevjp-frontend
  template:
    metadata:
      labels:
        app: reeldevjp-frontend
    spec:
      containers:
        - name: frontend
          image: ghcr.io/penti-nameko/reeldevjp-frontend:latest
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
