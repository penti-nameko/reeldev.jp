apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: reeldevjp-ingressroute
  namespace: reeldevjp
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`reeldev.jp`) && PathPrefix(`/api`)
      kind: Rule
      services:
        - name: reeldevjp-bff
          port: 3001
      middlewares:
        - name: buffermiddleware
    - match: Host(`reeldev.jp`)
      kind: Rule
      services:
        - name: reeldevjp-frontend
          port: 80
      middlewares:
        - name: buffermiddleware
  tls:
    secretName: reeldevjp-tls