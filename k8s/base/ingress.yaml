apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: reeldevjp-ingress
  namespace: reeldevjp
  annotations:
    # Traefik Middlewares の指定 (namespace-name@kubernetescrd 形式)
    traefik.ingress.kubernetes.io/router.middlewares: "buffermiddleware-reeldevjp@kubernetescrd"
    # TLS: cert-manager（そのままで動作します）
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - reeldev.jp
      secretName: reeldevjp-tls
  rules:
    - host: reeldev.jp
      http:
        paths:
          # /api/* は BFF へ
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: reeldevjp-bff
                port:
                  number: 3001
          # それ以外は Frontend へ
          - path: /
            pathType: Prefix
            backend:
              service:
                name: reeldevjp-frontend
                port:
                  number: 80