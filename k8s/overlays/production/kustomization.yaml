apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

bases:
  - ../../base

# 本番: replica 数を増やす
patches:
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
    target:
      kind: Deployment
      name: reeldevjp-frontend
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
    target:
      kind: Deployment
      name: reeldevjp-bff

# イメージタグは ArgoCD Image Updater または CI で上書き
images:
  - name: ghcr.io/penti-nameko/portfolio-frontend
    newTag: "a7097a4b8f5d2f5373822e1a6636c1e519fda891"
  - name: ghcr.io/penti-nameko/portfolio-bff
    newTag: "a7097a4b8f5d2f5373822e1a6636c1e519fda891"
  - name: ghcr.io/penti-nameko/reeldevjp-frontend
    newTag: "a7097a4b8f5d2f5373822e1a6636c1e519fda891"
  - name: ghcr.io/penti-nameko/reeldevjp-bff
    newTag: "a7097a4b8f5d2f5373822e1a6636c1e519fda891"
