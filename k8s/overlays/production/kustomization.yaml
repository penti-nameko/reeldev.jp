apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

bases:
  - ../../base

# 本番: replica 数を増やす
patches:
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
    target:
      kind: Deployment
      name: reeldevjp-frontend
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
    target:
      kind: Deployment
      name: reeldevjp-bff

# イメージタグは ArgoCD Image Updater または CI で上書き
images:
  - name: ghcr.io/penti-nameko/portfolio-frontend
    newTag: "e8b586f64bd97fada285f4fb4057437a35c450e3"
  - name: ghcr.io/penti-nameko/portfolio-bff
    newTag: "e8b586f64bd97fada285f4fb4057437a35c450e3"
  - name: ghcr.io/penti-nameko/reeldevjp-frontend
    newTag: "e8b586f64bd97fada285f4fb4057437a35c450e3"
  - name: ghcr.io/penti-nameko/reeldevjp-bff
    newTag: "e8b586f64bd97fada285f4fb4057437a35c450e3"
