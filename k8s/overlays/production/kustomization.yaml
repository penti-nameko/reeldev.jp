apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

bases:
  - ../../base

# 本番: replica 数を増やす
patches:
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
    target:
      kind: Deployment
      name: reeldevjp-frontend
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
    target:
      kind: Deployment
      name: reeldevjp-bff

# イメージタグは ArgoCD Image Updater または CI で上書き
images:
  - name: ghcr.io/penti-nameko/portfolio-frontend
    newTag: "807057293fe308cb3165a208d3ab86a226c4f23d"
  - name: ghcr.io/penti-nameko/portfolio-bff
    newTag: "807057293fe308cb3165a208d3ab86a226c4f23d"
  - name: ghcr.io/penti-nameko/reeldevjp-frontend
    newTag: "807057293fe308cb3165a208d3ab86a226c4f23d"
  - name: ghcr.io/penti-nameko/reeldevjp-bff
    newTag: "807057293fe308cb3165a208d3ab86a226c4f23d"
