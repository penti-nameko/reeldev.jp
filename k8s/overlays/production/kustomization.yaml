apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

bases:
  - ../../base

# 本番: replica 数を増やす
patches:
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
    target:
      kind: Deployment
      name: portfolio-frontend
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
    target:
      kind: Deployment
      name: portfolio-bff

# イメージタグは ArgoCD Image Updater または CI で上書き
images:
  - name: ghcr.io/penti-nameko/portfolio-frontend
    newTag: "latest"
  - name: ghcr.io/penti-nameko/portfolio-bff
    newTag: "latest"
